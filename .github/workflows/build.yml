name: build

# Builds and tests hero-bar natively on every supported architecture, in a
# Debian testing container (the HeroineOS base). armv7 runs under QEMU.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-24.04,     platform: linux/amd64 }
          - { arch: i686,    runner: ubuntu-24.04,     platform: linux/386 }
          - { arch: aarch64, runner: ubuntu-24.04-arm, platform: linux/arm64 }
          - { arch: armv7,   runner: ubuntu-24.04,     platform: linux/arm/v7, qemu: true }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - if: ${{ matrix.qemu }}
        uses: docker/setup-qemu-action@v3
      - name: Build and test
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD":/src -w /src debian:testing sh -euc '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends ca-certificates curl git build-essential cmake pkg-config \
              libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev libxrender-dev libxfixes-dev \
              libpango1.0-dev libcairo2-dev libgl-dev libwayland-dev wayland-protocols libxkbcommon-dev libdbus-1-dev >/dev/null
            curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal
            . "$HOME/.cargo/env"
            rustc -vV | sed -n "s/^host: //p"
            cargo build --release --locked
            cargo test --release --locked
            mkdir -p out && cp target/release/hero-bar out/hero-bar-${{ matrix.arch }}
            ls -l out
          '
      - uses: actions/upload-artifact@v4
        with:
          name: hero-bar-${{ matrix.arch }}
          path: out/hero-bar-${{ matrix.arch }}
