# Default configuration for herobar.
#
# This is a good starter configuration. Copy it to ~/.config/hero/bar.toml and build
# yours on top of it:
#   herobar --print-default-config > ~/.config/hero/bar.toml
# ---
# Colors and fonts come from the shared HeroUI theme (~/.config/heroui/theme.conf),
# so the bar matches every other HeroUI program. Override them in [style] below.

# ---------------------------------------------------------

# The bar itself.
[bar]
position = "top"       # "top" or "bottom"
height = 34
reserve-space = true   # Keep maximized/tiled windows from covering the bar
padding = 6            # Space between the screen edges and the outer modules
spacing = 4            # Space between modules

# Islands: each module gets its own background and the space between them
# (and around them) is see-through. Needs a Wayland compositor; on X11 the
# islands sit on the bar instead.
islands = false
island-style = "rounded"   # "sharp", "rounded" or "pill"

# Modules, from the screen edge inwards for left/right. Each name refers to a
# [modules.<name>] section below. Kinds: clock, cpu, memory, battery, network,
# volume, taskbar, workspaces, spacer, group/<name>, custom/<name>.
# For more than one of a kind, add "/<anything>": "cpu/big", "spacer/2"...
modules-left = ["custom/menu", "workspaces", "taskbar"]
modules-center = ["clock"]
modules-right = ["volume", "network", "group/system", "battery"]

# ---------------------------------------------------------

# Theme overrides for the bar only. Leave a key out to use the HeroUI theme.
# Colors: "#rgb", "#rrggbb" or "#rrggbbaa" (alpha is ignored).
[style]
# background = "#14141c"
# foreground = "#e6e6f0"
# hover = "#2a2a3a"      # Background of a module under the mouse, if it's clickable
# font = "Inter"
# font-size = 14
# icon-size = 16          # Default: font size + 2
# module-padding = 10     # Space left and right inside each module
# module-margin = 3       # Space above and below module backgrounds (islands, hover)

# ---------------------------------------------------------

# Modules.
#
# Every module accepts:
#   interval = 2               # Seconds between updates
#   on-click = "command"       # Shorthand for the table form below
#   on-click = { action = "run-command", arg = "command" }
#   tooltip = false            # No details when the mouse rests on it
#   icon = "name"              # Shown before the text: a built-in icon (apps, app,
#                              # battery, clock, cpu, memory, network-wired,
#                              # network-wireless, network-offline, power, search,
#                              # settings, terminal, volume-high, volume-low,
#                              # volume-muted), an icon theme name ("firefox-esr")
#                              # or an image path. "" for none. Battery, network
#                              # and volume change theirs with their state.
#   padding = 6                # Size overrides for this module only
#   icon-size = 18
#   font-size = 12
#
# Commands run through "sh -c", like the compositor's run-command action.

# Placeholders follow strftime: man 3 strftime. Click: a calendar of the
# month (popup = false turns it off).
[modules.clock]
format = "%a %d %b  %H:%M"
interval = 1
first-weekday = "monday"   # or "sunday", in the calendar

# {usage}: busy CPU time since the last update, in percent
[modules.cpu]
format = "{usage}%"
interval = 2

# {used} {total} (GiB) {percent}
[modules.memory]
format = "{used}/{total} GiB"
interval = 5

# {capacity} (percent), {status}: Charging, Discharging, Full...,
# {time}: until empty or full. The icon shows the level, or charging.
# Hover: percent, status and time left. Hidden without a battery.
[modules.battery]
format = "{capacity}%"
interval = 30

# Shows the interface the default route goes through.
# {ifname} {state}: up, down, dormant...
[modules.network]
format = "{ifname}"
format-disconnected = "offline"
interval = 5

# Volume of the default output through PipeWire (wpctl, from the wireplumber
# package) or PulseAudio / pipewire-pulse (pactl). Hidden if neither works.
# {volume} (percent); the icon shows muted/low/high.
[modules.volume]
format = "{volume}%"
interval = 5
on-click = "pavucontrol"

# Workspaces of the bar's monitor. Click to switch; the wheel steps through.
# From HeroWM's IPC or sway's.
[modules.workspaces]
show = "all"             # "all", or "occupied" (with windows, plus the shown one)
# output = "eDP-1"       # Whose workspaces (default: the active monitor)

# Open windows and pinned apps. Click: open/focus (again: next window of the
# app); middle click: close the window; right click: pin/unpin, move to a
# folder, close... (the bar edits this file itself, keeping comments).
# Folders keep pinned apps tidy: { folder = "Games", apps = ["steam", ...] }
# (folders in folders too; icon = "..." instead of small icons of its apps).
# A click on a folder opens it; running apps pinned in a folder stay in it.
# Window list from HeroWM's IPC, or wlr-foreign-toplevel-management (sway,
# Hyprland, labwc, river, Wayfire...).
[modules.taskbar]
show = "both"            # "running", "pinned" or "both"
style = "icons"          # "icons": one button per app (dots = its windows)
                         # "icons-titles": one button per window, with its title
pinned = ["foot", "firefox-esr", "heroappearance"]   # .desktop file names; missing ones are skipped
max-width = 600          # The most room it takes; buttons shrink to fit
fixed-width = false      # true: always max-width, so other modules never move
button-width = 180       # icons-titles: the widest a window button gets
workspace = "all"        # "current": only windows on the current workspace

# Groups show their modules together on one background (one island), e.g.
# CPU and memory as one. drawer = true collapses a group to its icon; a
# click opens it in place. Groups can't contain groups.
[modules."group/system"]
modules = ["cpu", "memory"]
# drawer = true
# icon = "settings"

# Spacers: fixed space, or expand = true to share the section's free space
# with its edge, which centers what's between them. E.g.
# modules-left = ["custom/menu", "spacer", "taskbar"] centers the taskbar
# between the menu and the clock's section.
#   [modules.spacer]
#   width = 12
#   expand = false
#   style = "none"       # "none", "line" or "dots"

# Custom modules show fixed text (`text`), or the first line a command
# prints (`exec`, run every `interval` seconds). A line like
# {"text": "21°", "icon": "weather-clear"} sets the icon too. E.g.:
#   [modules."custom/uptime"]
#   icon = "clock"
#   exec = "uptime -p"
#   interval = 60
[modules."custom/menu"]
icon = "apps"
text = "HeroineOS"
on-click = { action = "run-command", arg = "heroappearance" }
