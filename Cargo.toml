[package]
name = "herobar"
version = "0.1.3"
description = "A lightweight status bar for Wayland (and X11), built on HeroUI"
repository = "https://github.com/HeroineOS/HeroBar"
license = "MIT OR Apache-2.0"
edition = "2021"

[dependencies]
heroui = { git = "https://github.com/HeroineOS/HeroUI", features = ["layer-shell"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }

# Native Wayland panels need wlr-layer-shell, which upstream fltk-sys lacks.
# The HeroineOS fork is fltk-sys 1.5.23 plus layer-shell (same API).
[patch.crates-io]
fltk-sys = { git = "https://github.com/HeroineOS/fltk-sys" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.deb]
maintainer = "HeroineOS <https://github.com/HeroineOS>"
copyright = "HeroineOS contributors"
section = "x11"
priority = "optional"
depends = "$auto"
extended-description = """\
A lightweight status bar built on HeroUI. A native panel (wlr-layer-shell) on \
Wayland compositors that support it, a dock window on X11. Configured in \
~/.config/hero/bar.toml; run `herobar --print-default-config` for a commented \
starting point."""
assets = [
    ["target/release/herobar", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/herobar/README.md", "644"],
    ["res/bar.toml", "usr/share/doc/herobar/examples/bar.toml", "644"],
]
